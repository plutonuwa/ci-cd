name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fix binary permissions
        run: chmod +x node_modules/.bin/jest

      - name: Run tests
        run: npm test

      - name: Check linting (optional)
        run: npx eslint src/ --ext .js || true

  e2e:
    runs-on: ubuntu-latest
    needs: test   # only runs if unit tests passed

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Start app & run E2E tests
        run: |
          npm start &        # start the server in background
          sleep 3            # wait for it to boot
          npx playwright test
          
  apitests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install dependencies
        run: python -m venv .venv  
        run: source .venv/bin/activate && pip install -r ./backend/requirements.txt

      - name: Run API tests
        run: source .venv/bin/activate && pytest ./backend/test.py
