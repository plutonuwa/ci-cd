name: CI Pipeline

on:
  push:
    branches: [api]
  pull_request:
    branches: [api]

jobs: 
  apitests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }

      - name: Install dependencies
        run: |
            python -m venv .venv  
            source .venv/bin/activate 
            pip install -r ./backend/requirements.txt

      - name: Run API tests
        run: |
            source .venv/bin/activate 
            pytest
  
  create-pr:
    runs-on: ubuntu-latest
    needs: apitests              # only runs if api-tests job passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/api'
 
    # IMPORTANT: this job needs write permission to create PRs
    permissions:
      contents: write
      pull-requests: write
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Create Pull Request to main
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # auto-provided, no setup needed
          base: main                            # PR target branch
          branch: api                   # FIXED: The internal branch name the action uses to track the PR
          title: "✅ API tests passed — merge api → main"
          body: |
            ## Automated PR
 
            All API tests passed on the `api` branch.
 
            **Triggered by:** ${{ github.actor }}
            **Commit:** ${{ github.sha }}
            **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
 
            ### What was tested
            - API endpoint tests (pytest)
 
            Merge this PR to deploy to production.
          labels: automated, api-tested
          draft: false

  deploy-to-aws:
    runs-on: ubuntu-latest
    needs: apitests # Gatekeeper: Only deploy if tests pass!
    
    steps:
      - name: Execute Remote SSH Commands to Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_IP }}
          username: ${{ secrets.AWS_SSH_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            # Navigate to the project folder on EC2
            cd ~/ci-cd
            
            # Fetch and pull the newest code from main
            git pull origin main
            
            # Activate environment and update any new dependencies
            source .venv/bin/activate
            pip install -r backend/requirements.txt
            
            # Stop any older FastAPI instances running on port 8000
            fuser -k 8000/tcp || true
            
            # Start FastAPI in the background using nohup (so it stays alive when SSH closes)
            nohup uvicorn backend.main:app --host 0.0.0.0 --port 8000 > fastapi.log 2>&1 &